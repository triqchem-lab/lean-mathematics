name: build

on:
  push:
  pull_request:

jobs:
  # 形式化验证 (Lean 交叉验证层)
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Update dependencies
        run: lake update
      - name: Build
        run: lake build
      - name: Style lint (mathlib lint-style)
        run: python3 scripts/lint-style.py $(find LeanMathematics -name '*.lean')
      - name: Structure test
        run: bash test/structure.sh

  # 数值验证 (math 库: C++23 + Rust — 编译型, 不用 Python 防慢)
  numerical:
    runs-on: ubuntu-latest
    steps:
      # 数值计算依赖环境: 云端自动下载 math 库, 放在 workspace 同级 sibling
      - name: Download math library (数值计算依赖)
        run: git clone --depth 1 https://github.com/triqchem-lab/math.git "${{ github.workspace }}/../math"
      - name: C++ numerical verification (AVX-512 虚拟实现, 256 高低位拼接)
        run: |
          cd "${{ github.workspace }}/../math/cpp"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust numerical verification
        run: |
          cd "${{ github.workspace }}/../math/rust/sov-math"
          cargo test
