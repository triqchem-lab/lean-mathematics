name: env-init

# 环境初始化: 安装工具链 + 拉取依赖 (手动触发, 或环境文件变更时触发)
on:
  workflow_dispatch:
  push:
    paths:
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      # checkout 本仓库 + math 子模块 (完整下载)
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Lean 工具链 (读 lean-toolchain)
      - uses: leanprover/lean-action@v1

      # 拉取 mathlib (钉扎 commit) + 预热 olean 缓存
      - name: Fetch mathlib
        run: lake update

      # Rust 工具链
      - uses: dtolnay/rust-toolchain@stable

      # 环境自检
      - name: Verify environment
        run: |
          lean --version
          rustc --version
          gcc --version
          cmake --version
