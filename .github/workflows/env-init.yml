name: env-init

# 环境初始化: 安装工具链 + 拉取依赖 (手动触发, 或环境文件变更时触发)
on:
  workflow_dispatch:
  push:
    paths:
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'

# 最小权限: 只读仓库内容, 其余默认 none (mathlib olean 走公共 blob, 无需 token)
permissions:
  contents: read

# 同分支连推时取消旧运行, 避免陈旧结果竞争
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      # checkout 本仓库 + math 子模块 (完整下载)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      # Lean 工具链 (SHA/cache 配置集中在 composite action)
      - uses: ./.github/actions/setup-lean

      # 拉取 mathlib (钉扎 commit) + 预热 olean 缓存
      - name: Fetch mathlib
        run: lake update

      # Rust 工具链
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # 环境自检
      - name: Verify environment
        run: |
          set -o pipefail
          lean --version
          rustc --version
          gcc --version
          cmake --version
