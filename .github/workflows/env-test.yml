name: env-test

# 环境测试: 验证工具链版本 + Mathlib 导入冒烟 (手动触发, 或环境文件变更时触发)
on:
  workflow_dispatch:
  push:
    paths:
      - 'lean-toolchain'
      - 'lakefile.toml'

# 最小权限: 只读仓库内容
permissions:
  contents: read

# 同分支连推时取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-lean

      - name: Update dependencies
        run: lake update

      # 冒烟: Mathlib 能否正常导入 (走缓存 olean)
      - name: Smoke test Mathlib import
        run: |
          set -o pipefail
          printf 'import Mathlib\n#check frobenius\n#check ZMod 3\n' > /tmp/smoke.lean
          lake env lean /tmp/smoke.lean

      # Rust 工具链冒烟
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Smoke test Rust
        run: rustc --version && cargo --version

      # 环境版本清单
      - name: Environment versions
        run: |
          set -o pipefail
          lean --version
          rustc --version
          gcc --version
          cmake --version
