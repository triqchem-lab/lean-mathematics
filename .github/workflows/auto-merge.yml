name: Auto-merge on direction approval

# owner 判定 PR 方向一致后, 加 `direction-consistent` label 触发自动合并。
# 合并仍受分支保护约束: required checks (含 direction-check) 全绿才真正合并。
# 控制权: 只有能打 label 的成员 (owner) 能触发, 方向不一致的 PR 不会被打此 label。
on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.label.name == 'direction-consistent'
    runs-on: ubuntu-latest
    steps:
      - name: Approve and enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          # 加 direction-consistent label 即视为 owner 方向批准
          gh pr review "$PR" --approve
          gh pr merge "$PR" --auto --squash --delete-branch
