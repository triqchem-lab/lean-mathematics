name: formal-test

# 形式化库自动化测试: Lean 交叉验证 + math 库数值验证 (每次 push / PR 自动触发)
on:
  push:
  pull_request:

jobs:
  # 形式化验证 (Lean 交叉验证层)
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Update dependencies
        run: lake update
      - name: Build
        run: lake build
      - name: Style lint (mathlib lint-style)
        run: python3 scripts/lint-style.py $(find LeanMathematics -name '*.lean')
      - name: Structure test
        run: bash test/structure.sh

  # 数值验证 (math 库: C++23 + Rust — 编译型, 不用 Python 防慢)
  numerical:
    runs-on: ubuntu-latest
    steps:
      # math 库缓存 (env-init 预热后命中恢复, 跨 run 复用不重复下载)
      - name: Cache math library
        id: math-cache
        uses: actions/cache@v4
        with:
          path: math
          key: math-lib
          restore-keys: math-lib
      - name: Download/update math library
        run: |
          if [ -d math/.git ]; then
            git -C math pull --depth 1
          else
            git clone --depth 1 https://github.com/triqchem-lab/math.git math
          fi
      - name: C++ numerical verification (AVX-512 虚拟实现, 256 高低位拼接)
        run: |
          cd math/cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust numerical verification
        run: |
          cd math/rust/sov-math
          cargo test
