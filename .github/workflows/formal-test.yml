name: formal-test

# 形式化库自动化测试: Lean 交叉验证 + 数值验证 (每次 push / PR 自动触发)
on:
  push:
  pull_request:

jobs:
  # 形式化验证 (Lean 交叉验证层)
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Update dependencies
        run: lake update
      - name: Build
        run: lake build
      - name: Style lint (mathlib lint-style)
        run: python3 scripts/lint-style.py $(find LeanMathematics -name '*.lean')
      - name: Structure test
        run: bash test/structure.sh

  # 数值验证 (用户测试用例, 链接 math 子模块 — 只读依赖)
  numerical:
    runs-on: ubuntu-latest
    steps:
      # checkout 本仓库 + math 子模块 (完整下载, 子模块只读, 测试用例在本仓库 test/)
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: C++ numerical verification (test/cpp, 链接 math 子模块)
        run: |
          cd test/cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust numerical verification (test/rust)
        run: |
          cd test/rust
          cargo test
