name: formal-test

# 形式化库自动化测试: Lean 交叉验证 + 数值验证 (每次 push / PR 自动触发)
on:
  push:
  pull_request:

# 最小权限: 只读仓库内容 (mathlib olean 走公共 blob)
permissions:
  contents: read

# 同分支连推时取消旧运行, 避免陈旧结果竞争
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 形式化验证 (Lean 交叉验证层)
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-lean
      - name: Update dependencies
        run: lake update
      - name: Build
        run: lake build
      - name: Style lint (mathlib lint-style)
        run: python3 scripts/lint-style.py $(find LeanMathematics -name '*.lean')
      - name: Structure test
        run: bash test/structure.sh

  # 数值验证 (用户测试用例, 链接 math 子模块 — 只读依赖)
  numerical:
    runs-on: ubuntu-latest
    steps:
      # checkout 本仓库 + math 子模块 (完整下载, 子模块只读, 测试用例在本仓库 test/)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - name: C++ numerical verification (test/cpp, 链接 math 子模块)
        run: |
          set -o pipefail
          cd test/cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          ctest --test-dir build --output-on-failure
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Rust numerical verification (test/rust)
        run: |
          set -o pipefail
          cd test/rust
          cargo test
